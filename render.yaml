services:
  - type: web
    name: logistics-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_DB_INIT_ENABLED
        value: "false"
      - key: APP_DB_INIT_SEED
        value: "false"
      - key: APP_DB_INIT_DROP
        value: "false"
      - key: OPENROUTESERVICE_API_KEY
        sync: false
      - key: SECURITY_JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_ACCESS_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
    healthCheckPath: /actuator/health
    autoDeploy: true